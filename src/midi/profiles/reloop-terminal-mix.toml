# Reloop Terminal Mix 2 and Terminal Mix 4. Decks on MIDI channels 1-4: 1 and 3 on the left,
# 2 and 4 on the right; decks 3/4 drive CDeckJ's decks 1/2. Mixer channels 3/4 are left out.
# SHIFT is handled in hardware: shifted buttons send their number plus 0x46.
# The jog sends 0x28 in vinyl mode and 0x27 otherwise; both go to the jog.
name = "Reloop Terminal Mix"
ports = ["Terminal Mix 2", "Terminal Mix 4"]
jog_ticks_per_rev = 800
invert_tempo = false

[bind]
"deck1.play" = ["90 25", "92 25"]
"deck1.cue" = ["90 24", "92 24"]
"deck1.sync" = ["90 22", "92 22"]
"deck1.tempo_range" = ["90 01", "92 01"]
"deck1.master_tempo" = ["90 02", "92 02"]
"deck1.load" = ["90 32", "92 32"]
"deck1.tempo" = ["E0", "E2"]
"deck1.jog_touch" = ["90 28", "92 28"]
"deck1.jog" = ["B0 27", "B0 28", "B2 27", "B2 28"]
"deck1.jog_search" = ["B0 29", "B2 29"]
"deck1.loop_in" = ["90 0C", "92 0C"]
"deck1.loop_out" = ["90 0D", "92 0D"]
# LOOP encoder press; SHIFT + press exits the loop.
"deck1.loop_4" = ["90 0B", "92 0B"]
"deck1.reloop" = ["90 51", "92 51"]
"deck1.hotcue1" = ["90 10", "92 10"]
"deck1.hotcue2" = ["90 11", "92 11"]
"deck1.hotcue3" = ["90 12", "92 12"]
"deck1.hotcue4" = ["90 13", "92 13"]
"deck1.hotcue5" = ["90 18", "92 18"]
"deck1.hotcue6" = ["90 19", "92 19"]
"deck1.hotcue7" = ["90 1A", "92 1A"]
"deck1.hotcue8" = ["90 1B", "92 1B"]
"deck1.hotcue1_delete" = ["90 56", "92 56"]
"deck1.hotcue2_delete" = ["90 57", "92 57"]
"deck1.hotcue3_delete" = ["90 58", "92 58"]
"deck1.hotcue4_delete" = ["90 59", "92 59"]
"deck1.hotcue5_delete" = ["90 5E", "92 5E"]
"deck1.hotcue6_delete" = ["90 5F", "92 5F"]
"deck1.hotcue7_delete" = ["90 60", "92 60"]
"deck1.hotcue8_delete" = ["90 61", "92 61"]
"ch1.trim" = "B0 2B"
"ch1.hi" = "B0 2C"
"ch1.mid" = "B0 2D"
"ch1.low" = "B0 2E"
"ch1.filter" = "B0 2F"
"ch1.fader" = "B0 31"
"ch1.pfl" = "90 30"

"deck2.play" = ["91 25", "93 25"]
"deck2.cue" = ["91 24", "93 24"]
"deck2.sync" = ["91 22", "93 22"]
"deck2.tempo_range" = ["91 01", "93 01"]
"deck2.master_tempo" = ["91 02", "93 02"]
"deck2.load" = ["91 32", "93 32"]
"deck2.tempo" = ["E1", "E3"]
"deck2.jog_touch" = ["91 28", "93 28"]
"deck2.jog" = ["B1 27", "B1 28", "B3 27", "B3 28"]
"deck2.jog_search" = ["B1 29", "B3 29"]
"deck2.loop_in" = ["91 0C", "93 0C"]
"deck2.loop_out" = ["91 0D", "93 0D"]
"deck2.loop_4" = ["91 0B", "93 0B"]
"deck2.reloop" = ["91 51", "93 51"]
