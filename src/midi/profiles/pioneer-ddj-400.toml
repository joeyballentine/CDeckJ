# Pioneer DDJ-400. Pioneer's DDJ layout: deck controls on MIDI channels 1-2, browser and
# mixer globals on channel 7, BEAT FX on channel 5, pads on channels 8-11 (odd: SHIFT).
# "DDJ" also catches DDJ models without their own profile; most share these numbers.
name = "Pioneer DDJ-400"
ports = ["DDJ-400", "DDJ"]
jog_ticks_per_rev = 720
invert_tempo = false

[bind]
"deck1.play" = "90 0B"
"deck1.cue" = "90 0C"
"deck1.sync" = "90 58"
"deck1.tempo_range" = "90 60"
"deck1.reverse" = "90 47"
