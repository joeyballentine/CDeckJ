# Pioneer DDJ-200: two decks, 8 hot cue pads per deck (DDJ-400 numbering), no browse knob,
# LOAD, TRIM, loop or FX controls. EQ and filter knobs are read as 7-bit. The init message is
# the one Mixxx sends on connect.
name = "Pioneer DDJ-200"
ports = ["DDJ-200"]
jog_ticks_per_rev = 128
invert_tempo = false
init = ["F0 00 40 05 00 00 02 0A 00 03 01 F7"]

[bind]
"deck1.play" = "90 0B"
"deck1.cue" = "90 0C"
"deck1.sync" = "90 58"
"deck1.to_start" = "90 48"
"deck1.tempo" = "B0 00 20"
"deck1.jog_touch" = "90 36"
"deck1.jog_scratch" = "B0 22"
"deck1.jog_bend" = "B0 21"
"deck1.jog_search" = "B0 29"
"deck1.hotcue1" = "97 00"
"deck1.hotcue2" = "97 01"
"deck1.hotcue3" = "97 02"
"deck1.hotcue4" = "97 03"
"deck1.hotcue5" = "97 04"
"deck1.hotcue6" = "97 05"
"deck1.hotcue7" = "97 06"
"deck1.hotcue8" = "97 07"
"deck1.hotcue1_delete" = "98 00"
"deck1.hotcue2_delete" = "98 01"
"deck1.hotcue3_delete" = "98 02"
"deck1.hotcue4_delete" = "98 03"
"deck1.hotcue5_delete" = "98 04"
"deck1.hotcue6_delete" = "98 05"
"deck1.hotcue7_delete" = "98 06"
"deck1.hotcue8_delete" = "98 07"
"ch1.hi" = "B0 07"
"ch1.mid" = "B0 0B"
"ch1.low" = "B0 0F"
"ch1.fader" = "B0 13 33"
"ch1.pfl" = "90 54"
