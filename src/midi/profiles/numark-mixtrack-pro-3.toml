# Numark Mixtrack Pro 3 / Mixtrack 3. Decks on MIDI channels 2-3, browser, load and PFL on
# channel 1. SHIFT is software: the buttons send the same notes with or without it.
# The pads send different notes per pad mode: hot cue and auto loop modes are bound.
name = "Numark Mixtrack Pro 3"
ports = ["Mixtrack Pro 3", "Mixtrack 3"]
jog_ticks_per_rev = 1200
invert_tempo = false

[bind]
"deck1.shift" = "91 0B"
"deck1.play" = "91 01"
"deck1.cue" = "91 03"
"deck1.to_start" = "shift 91 03"
"deck1.sync" = "91 02"
"deck1.master_tempo" = "shift 91 02"
"deck1.load" = "90 10"
"deck1.tempo" = "B1 18 38"
"deck1.jog_touch" = "91 0C"
"deck1.jog" = "B1 11"
"deck1.jog_search" = "shift B1 11"
"deck1.loop_in" = "91 13"
"deck1.loop_out" = "91 14"
"deck1.reloop" = "91 15"
"deck1.loop_half" = "91 16"
"deck1.loop_double" = "shift 91 16"
"deck1.hotcue1" = "91 1B"
"deck1.hotcue2" = "91 1C"
"deck1.hotcue3" = "91 1D"
"deck1.hotcue4" = "91 1E"
"deck1.hotcue1_delete" = "shift 91 1B"
"deck1.hotcue2_delete" = "shift 91 1C"
"deck1.hotcue3_delete" = "shift 91 1D"
"deck1.hotcue4_delete" = "shift 91 1E"
# SHIFT + PITCH BEND -/+ jumps back/forward 4 beats.
"deck1.beatjump5" = "shift 91 04"
"deck1.beatjump6" = "shift 91 05"
# Auto loop pads: 2, 4, 8, 16 beats; with SHIFT 1/8 (no CDeckJ size), 1/4, 1/2, 1.
"deck1.beatloop4" = "91 17"
"deck1.beatloop5" = "91 18"
"deck1.beatloop6" = "91 19"
"deck1.beatloop7" = "91 1A"
"deck1.beatloop1" = "shift 91 18"
"deck1.beatloop2" = "shift 91 19"
"deck1.beatloop3" = "shift 91 1A"
# Level 0-82 lights the whole meter.
"deck1.meter" = "B0 02"
"ch1.trim" = "shift B1 04"
"ch1.hi" = "B1 01"
"ch1.mid" = "B1 02"
"ch1.low" = "B1 03"
"ch1.filter" = "B1 04"
"ch1.fader" = "B1 05"
"ch1.pfl" = "90 0E"
"deck2.shift" = "92 0B"
"deck2.play" = "92 01"
"deck2.cue" = "92 03"
"deck2.to_start" = "shift 92 03"
"deck2.sync" = "92 02"
"deck2.master_tempo" = "shift 92 02"
"deck2.load" = "90 11"
"deck2.tempo" = "B2 18 38"
"deck2.jog_touch" = "92 0C"
"deck2.jog" = "B2 11"
"deck2.jog_search" = "shift B2 11"
"deck2.loop_in" = "92 13"
"deck2.loop_out" = "92 14"
"deck2.reloop" = "92 15"
"deck2.loop_half" = "92 16"
"deck2.loop_double" = "shift 92 16"
"deck2.hotcue1" = "92 1B"
"deck2.hotcue2" = "92 1C"
"deck2.hotcue3" = "92 1D"
"deck2.hotcue4" = "92 1E"
"deck2.hotcue1_delete" = "shift 92 1B"
"deck2.hotcue2_delete" = "shift 92 1C"
"deck2.hotcue3_delete" = "shift 92 1D"
"deck2.hotcue4_delete" = "shift 92 1E"
"deck2.beatjump5" = "shift 92 04"
"deck2.beatjump6" = "shift 92 05"
"deck2.beatloop4" = "92 17"
"deck2.beatloop5" = "92 18"
"deck2.beatloop6" = "92 19"
"deck2.beatloop7" = "92 1A"
"deck2.beatloop1" = "shift 92 18"
"deck2.beatloop2" = "shift 92 19"
"deck2.beatloop3" = "shift 92 1A"
"deck2.meter" = "B0 03"
"ch2.trim" = "shift B2 04"
"ch2.hi" = "B2 01"
"ch2.mid" = "B2 02"
"ch2.low" = "B2 03"
"ch2.filter" = "B2 04"
"ch2.fader" = "B2 05"
"ch2.pfl" = "90 0F"
"mixer.crossfader" = "B0 07"
"mixer.head_level" = "B0 08"
"mixer.head_mix" = "B0 09"
"browser.turn" = "B0 17"
"browser.press" = "90 12"
