# Numark Mixtrack Pro FX. Decks on MIDI channels 1-2, pads and loop buttons on 5-6, FX buttons
# on 9-10, browser and globals on 16. SHIFT changes the notes of most buttons in hardware; the
# jog wheel sends the same CC either way, so SHIFT is also bound for SHIFT + jog.
# Pad modes are tracked in software: the pads send the same notes in every mode.
name = "Numark Mixtrack Pro FX"
ports = ["Mixtrack Pro FX"]
jog_ticks_per_rev = 1024
invert_tempo = false
led_off = 0x01
# Leave the demo light show; ask for the current knob and fader positions.
init = ["F0 7E 00 06 01 F7", "F0 00 20 7F 03 01 F7"]

[bind]
"deck1.play" = "90 00"
"deck1.cue" = "90 01"
"deck1.sync" = "90 02"
"deck1.to_start" = "90 05"
"deck1.reverse" = "90 08"
"deck1.master_tempo" = "90 2B"
"deck1.tempo_range" = "90 2C"
"deck1.shift" = "90 20"
"deck1.load" = "9F 02"
"deck1.tempo" = "B0 09 29"
"deck1.jog_touch" = "90 06"
"deck1.jog" = "B0 06"
"deck1.jog_search" = "shift B0 06"
"deck1.loop_4" = "94 40"
"deck1.reloop" = "94 41"
"deck1.loop_half" = "94 34"
"deck1.loop_double" = "94 35"
"deck1.loop_in" = "94 36"
"deck1.loop_out" = "94 37"
"deck1.hotcue1" = "94 14"
"deck1.hotcue2" = "94 15"
"deck1.hotcue3" = "94 16"
"deck1.hotcue4" = "94 17"
