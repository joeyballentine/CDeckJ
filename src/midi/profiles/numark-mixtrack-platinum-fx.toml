# Numark Mixtrack Platinum FX. The Mixtrack Pro FX layout with a deck switch: decks 1-4 on MIDI
# channels 1-4 (pads and loop buttons on 5-8), so decks 3/4 are listed with decks 1/2. The
# mixer strip sends on the channel of the selected deck, so its 3/4 messages go to mixer
# channels 1/2. SHIFT changes the notes of most buttons in hardware; the jog wheel sends the
# same CC either way, so SHIFT is also bound for SHIFT + jog.
# Pad modes are tracked in software: the pads send the same notes in every mode.
name = "Numark Mixtrack Platinum FX"
ports = ["Mixtrack Platinum FX"]
jog_ticks_per_rev = 1024
invert_tempo = false
led_off = 0x01
# Leave the demo light show; ask for the current knob and fader positions.
init = ["F0 7E 00 06 01 F7", "F0 00 20 7F 03 01 F7"]

[bind]
"deck1.play" = ["90 00", "92 00"]
"deck1.cue" = ["90 01", "92 01"]
"deck1.sync" = ["90 02", "92 02"]
"deck1.to_start" = ["90 05", "92 05"]
"deck1.master_tempo" = ["90 2B", "92 2B"]
"deck1.tempo_range" = ["90 2C", "92 2C"]
"deck1.shift" = ["90 20", "92 20"]
"deck1.load" = ["9F 02", "9F 04"]
"deck1.tempo" = ["B0 09 29", "B2 09 29"]
"deck1.jog_touch" = ["90 06", "92 06"]
"deck1.jog" = ["B0 06", "B2 06"]
"deck1.jog_search" = ["shift B0 06", "shift B2 06"]
"deck1.loop_4" = ["94 40", "96 40"]
"deck1.reloop" = ["94 41", "96 41"]
"deck1.loop_half" = ["94 34", "96 34"]
"deck1.loop_double" = ["94 35", "96 35"]
"deck1.loop_in" = ["94 36", "96 36"]
"deck1.loop_out" = ["94 37", "96 37"]
"deck1.hotcue1" = ["94 14", "96 14"]
"deck1.hotcue2" = ["94 15", "96 15"]
"deck1.hotcue3" = ["94 16", "96 16"]
"deck1.hotcue4" = ["94 17", "96 17"]
"deck1.hotcue5" = ["94 18", "96 18"]
"deck1.hotcue6" = ["94 19", "96 19"]
"deck1.hotcue7" = ["94 1A", "96 1A"]
"deck1.hotcue8" = ["94 1B", "96 1B"]
"deck1.hotcue1_delete" = ["94 1C", "96 1C"]
"deck1.hotcue2_delete" = ["94 1D", "96 1D"]
"deck1.hotcue3_delete" = ["94 1E", "96 1E"]
"deck1.hotcue4_delete" = ["94 1F", "96 1F"]
"deck1.hotcue5_delete" = ["94 20", "96 20"]
"deck1.hotcue6_delete" = ["94 21", "96 21"]
"deck1.hotcue7_delete" = ["94 22", "96 22"]
"deck1.hotcue8_delete" = ["94 23", "96 23"]
# Level 0-90 lights the whole meter.
"deck1.meter" = "B0 1F"
"ch1.trim" = ["B0 16", "B2 16"]
"ch1.hi" = ["B0 17", "B2 17"]
"ch1.mid" = ["B0 18", "B2 18"]
"ch1.low" = ["B0 19", "B2 19"]
"ch1.filter" = ["B0 1A", "B2 1A"]
"ch1.fader" = ["B0 1C", "B2 1C"]
"ch1.pfl" = ["90 1B", "92 1B"]
"deck2.play" = ["91 00", "93 00"]
"deck2.cue" = ["91 01", "93 01"]
"deck2.sync" = ["91 02", "93 02"]
"deck2.to_start" = ["91 05", "93 05"]
