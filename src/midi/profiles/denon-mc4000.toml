# Denon MC4000. Decks on MIDI channels 1-2, pads and loops on 5-6, FX on 9-10, browser and
# globals on 16. SHIFT is handled in hardware: shifted buttons send their own notes.
name = "Denon MC4000"
ports = ["MC4000"]
jog_ticks_per_rev = 605
invert_tempo = false
# Asks the controller to report its knob and fader positions.
init = ["F0 00 02 0B 7F 01 60 00 04 04 01 00 00 F7"]

[bind]
"deck1.play" = "90 00"
"deck1.cue" = "90 01"
"deck1.sync" = "90 02"
"deck1.tempo_range" = "90 0E"
# SHIFT + CUE
"deck1.to_start" = "90 05"
# SHIFT + VINYL (CENSOR)
"deck1.reverse" = "90 10"
"deck1.load" = "9F 02"
"deck1.tempo" = "B0 09 29"
"deck1.jog_touch" = "90 06"
"deck1.jog" = "B0 06"
"deck1.loop_4" = "94 32"
"deck1.loop_half" = "94 34"
"deck1.loop_double" = "94 35"
# SHIFT + x1/2, SHIFT + x2
"deck1.loop_in" = "94 38"
"deck1.loop_out" = "94 39"
"deck1.reloop" = "94 33"
"deck1.hotcue1" = "94 14"
"deck1.hotcue2" = "94 15"
"deck1.hotcue3" = "94 16"
"deck1.hotcue4" = "94 17"
"deck1.hotcue1_delete" = "94 1C"
"deck1.hotcue2_delete" = "94 1D"
"deck1.hotcue3_delete" = "94 1E"
"deck1.hotcue4_delete" = "94 1F"
"ch1.trim" = "B0 16"
"ch1.hi" = "B0 17"
"ch1.mid" = "B0 18"
"ch1.low" = "B0 19"
"ch1.filter" = "B0 1A"
"ch1.fader" = "B0 1C"
"ch1.pfl" = "90 1B"

"deck2.play" = "91 00"
"deck2.cue" = "91 01"
"deck2.sync" = "91 02"
"deck2.tempo_range" = "91 0E"
"deck2.to_start" = "91 05"
"deck2.reverse" = "91 10"
"deck2.load" = "9F 03"
"deck2.tempo" = "B1 09 29"
"deck2.jog_touch" = "91 06"
"deck2.jog" = "B1 06"
"deck2.loop_4" = "95 32"
"deck2.loop_half" = "95 34"
"deck2.loop_double" = "95 35"
"deck2.loop_in" = "95 38"
"deck2.loop_out" = "95 39"
"deck2.reloop" = "95 33"
"deck2.hotcue1" = "95 14"
"deck2.hotcue2" = "95 15"
"deck2.hotcue3" = "95 16"
"deck2.hotcue4" = "95 17"
"deck2.hotcue1_delete" = "95 1C"
"deck2.hotcue2_delete" = "95 1D"
"deck2.hotcue3_delete" = "95 1E"
"deck2.hotcue4_delete" = "95 1F"
"ch2.trim" = "B1 16"
"ch2.hi" = "B1 17"
"ch2.mid" = "B1 18"
"ch2.low" = "B1 19"
"ch2.filter" = "B1 1A"
"ch2.fader" = "B1 1C"
"ch2.pfl" = "91 1B"

"mixer.crossfader" = "BF 08"
"mixer.head_level" = "BF 0C"
"mixer.head_mix" = "BF 0D"
"browser.turn" = "BF 00"
"browser.press" = "9F 1F"
"browser.back" = "9F 07"
# PANEL
"browser.view_next" = "9F 11"

# Both FX sections drive the one effect: first FX button, first FX select, first FX knob.
"fx.on" = ["98 00", "99 00"]
"fx.next" = ["98 0B", "99 0B"]
"fx.level" = ["B8 00", "B9 00"]
