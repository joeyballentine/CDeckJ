# Roland DJ-505: two mixer channels, four decks. With DECK 3/4 selected a side sends on MIDI
# channel 3/4 (pads and loops on 7/8); those messages drive decks 1/2 here. The init messages
# switch it to Serato mode, which it leaves after about 1.5 s without the keep-alive.
# Pad notes do not change with the pad mode. SHIFT changes most buttons in hardware; only the
# jog wheels need the software SHIFT.
name = "Roland DJ-505"
ports = ["DJ-505"]
jog_ticks_per_rev = 512
invert_tempo = true
init = ["F0 00 20 7F 00 F7", "F0 00 20 7F 01 F7"]
keepalive = ["BF 64 00"]

[bind]
"deck1.shift" = "9F 00"
"deck1.play" = ["90 00", "92 00"]
"deck1.cue" = ["90 01", "92 01"]
"deck1.sync" = ["90 02", "92 02"]
# SHIFT + KEY LOCK.
"deck1.tempo_range" = ["90 0E", "92 0E"]
"deck1.master_tempo" = ["90 0D", "92 0D"]
# SHIFT + CUE.
"deck1.to_start" = ["90 05", "92 05"]
"deck1.load" = ["9F 02", "9F 04"]
"deck1.tempo" = ["B0 09 3B", "B2 09 3B"]
"deck1.jog_touch" = ["90 06", "92 06"]
"deck1.jog" = ["B0 06", "B2 06"]
"deck1.jog_search" = ["shift B0 06", "shift B2 06"]
"deck1.loop_in" = ["94 38", "96 38"]
"deck1.loop_out" = ["94 39", "96 39"]
"deck1.reloop" = ["94 33", "96 33"]
"deck1.loop_4" = ["94 40", "96 40"]
"deck1.loop_half" = ["94 34", "96 34"]
"deck1.loop_double" = ["94 35", "96 35"]
"deck1.hotcue1" = ["94 14", "96 14"]
"deck1.hotcue2" = ["94 15", "96 15"]
"deck1.hotcue3" = ["94 16", "96 16"]
"deck1.hotcue4" = ["94 17", "96 17"]
