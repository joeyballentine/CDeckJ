"deck1.hotcue4_delete" = ["94 1F", "96 1F"]
"deck1.hotcue5_delete" = ["94 20", "96 20"]
"deck1.hotcue6_delete" = ["94 21", "96 21"]
"deck1.hotcue7_delete" = ["94 22", "96 22"]
"deck1.hotcue8_delete" = ["94 23", "96 23"]
"ch1.trim" = ["B0 16 34", "B2 16 34"]
"ch1.hi" = ["B0 17 35", "B2 17 35"]
