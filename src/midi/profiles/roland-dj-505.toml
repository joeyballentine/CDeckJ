# FX 1 and FX 2 both drive the one BEAT FX: ON 1 is ON, SHIFT + ON 1 selects, knob 1 sets
# the level, CH ASSIGN 1/2 pick the channel.
"fx.on" = ["98 00", "99 00"]
"fx.next" = ["98 0B", "99 0B"]
"fx.level" = ["B8 00", "B9 00"]
"fx.ch1" = ["98 05", "99 05"]
"fx.ch2" = ["98 06", "99 06"]
