# Pioneer DDJ-SB: two decks, no TRIM knobs, four pads per deck; loops are pad modes. HOT CUE
# mode covers cues 1-4, the second hot cue mode 5-8.
name = "Pioneer DDJ-SB"
ports = ["DDJ-SB"]
jog_ticks_per_rev = 720
invert_tempo = false

[bind]
"deck1.play" = "90 0B"
"deck1.cue" = "90 0C"
"deck1.sync" = "90 58"
"deck1.master_tempo" = "90 1A"
"deck1.reverse" = "90 47"
"deck1.to_start" = "90 48"
"deck1.tempo" = "B0 00 20"
"deck1.jog_touch" = ["90 36", "90 67"]
"deck1.jog_scratch" = "B0 22"
"deck1.jog_bend" = ["B0 21", "B0 23"]
"deck1.jog_search" = ["B0 1F", "B0 26"]
"deck1.load" = "96 46"
"deck1.hotcue1" = "97 00"
"deck1.hotcue2" = "97 01"
"deck1.hotcue3" = "97 02"
"deck1.hotcue4" = "97 03"
"deck1.hotcue5" = "97 40"
"deck1.hotcue6" = "97 41"
"deck1.hotcue7" = "97 42"
"deck1.hotcue8" = "97 43"
"deck1.hotcue1_delete" = "97 08"
"deck1.hotcue2_delete" = "97 09"
"deck1.hotcue3_delete" = "97 0A"
"deck1.hotcue4_delete" = "97 0B"
"deck1.hotcue5_delete" = "97 48"
"deck1.hotcue6_delete" = "97 49"
"deck1.hotcue7_delete" = "97 4A"
"deck1.hotcue8_delete" = "97 4B"
# AUTO LOOP mode: pads 1-4 loop 1/2/4/8 beats, SHIFT + pads 1-2 loop 16/32.
"deck1.beatloop3" = "97 10"
"deck1.beatloop4" = "97 11"
"deck1.beatloop5" = "97 12"
"deck1.beatloop6" = "97 13"
"deck1.beatloop7" = "97 18"
"deck1.beatloop8" = "97 19"
# MANUAL LOOP mode: IN, OUT, EXIT, 1/2X; SHIFT + pad 4 is 2X.
"deck1.loop_in" = "97 20"
"deck1.loop_out" = "97 21"
"deck1.reloop" = "97 22"
"deck1.loop_half" = "97 23"
"deck1.loop_double" = "97 2B"
