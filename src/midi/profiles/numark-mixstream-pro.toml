# Numark Mixstream Pro. Deck buttons on MIDI channels 3-4, mixer on 1-2, browser and globals
# on 16. SHIFT is software: the buttons send the same notes with or without it.
# Pad modes are tracked in software: the pads send the same notes in every mode.
# The jog wheels report an absolute 14-bit position, which CDeckJ can't read: not bound.
name = "Numark Mixstream Pro"
ports = ["Mixstream Pro"]
invert_tempo = true
led_off = 0x01

[bind]
"deck1.shift" = "92 1C"
"deck1.play" = "92 0A"
"deck1.cue" = "92 09"
"deck1.sync" = "92 08"
"deck1.load" = "9F 01"
"deck1.tempo" = "B2 1F 4B"
"deck1.hotcue1" = "92 0F"
"deck1.hotcue2" = "92 10"
"deck1.hotcue3" = "92 11"
"deck1.hotcue4" = "92 12"
"deck1.hotcue1_delete" = "shift 92 0F"
"deck1.hotcue2_delete" = "shift 92 10"
"deck1.hotcue3_delete" = "shift 92 11"
"deck1.hotcue4_delete" = "shift 92 12"
"ch1.trim" = "B0 03"
"ch1.hi" = "B0 04"
"ch1.mid" = "B0 06"
"ch1.low" = "B0 08"
"ch1.filter" = "B0 0B"
"ch1.fader" = "B0 0E"
"ch1.pfl" = "90 0D"
"deck2.shift" = "93 1C"
"deck2.play" = "93 0A"
"deck2.cue" = "93 09"
"deck2.sync" = "93 08"
"deck2.load" = "9F 02"
"deck2.tempo" = "B3 1F 4B"
"deck2.hotcue1" = "93 0F"
"deck2.hotcue2" = "93 10"
"deck2.hotcue3" = "93 11"
"deck2.hotcue4" = "93 12"
"deck2.hotcue1_delete" = "shift 93 0F"
"deck2.hotcue2_delete" = "shift 93 10"
"deck2.hotcue3_delete" = "shift 93 11"
"deck2.hotcue4_delete" = "shift 93 12"
"ch2.trim" = "B1 03"
"ch2.hi" = "B1 04"
"ch2.mid" = "B1 06"
"ch2.low" = "B1 08"
"ch2.filter" = "B1 0B"
"ch2.fader" = "B1 0E"
"ch2.pfl" = "91 0D"
"mixer.crossfader" = "BF 0E"
"mixer.head_mix" = "BF 09"
"mixer.head_level" = "BF 0A"
"browser.turn" = "BF 05"
