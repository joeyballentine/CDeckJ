# Pioneer DDJ-SB2: two mixer channels, four decks (DECK 3/4 on MIDI channels 3/4, pads on
# 10/11). Four pads per deck; loops are pad modes. HOT CUE mode covers cues 1-4, the second
# hot cue mode 5-8.
name = "Pioneer DDJ-SB2"
ports = ["DDJ-SB2"]
jog_ticks_per_rev = 720
invert_tempo = false
init = ["9B 09 7F"]

[bind]
"deck1.play" = ["90 0B", "92 0B"]
"deck1.cue" = ["90 0C", "92 0C"]
"deck1.sync" = ["90 58", "92 58"]
"deck1.master_tempo" = ["90 1A", "92 1A"]
"deck1.reverse" = ["90 47", "92 47"]
"deck1.to_start" = ["90 48", "92 48"]
"deck1.tempo" = ["B0 00 20", "B2 00 20"]
"deck1.jog_touch" = ["90 36", "90 67", "92 36", "92 67"]
"deck1.jog_scratch" = ["B0 22", "B2 22"]
"deck1.jog_bend" = ["B0 21", "B0 23", "B2 21", "B2 23"]
"deck1.jog_search" = ["B0 1F", "B0 26", "B2 1F", "B2 26"]
# SHIFT + KEY LOCK.
"deck1.tempo_range" = ["90 60", "92 60"]
"deck1.load" = ["96 46", "96 48"]
"deck1.hotcue1" = ["97 00", "99 00"]
"deck1.hotcue2" = ["97 01", "99 01"]
"deck1.hotcue3" = ["97 02", "99 02"]
"deck1.hotcue4" = ["97 03", "99 03"]
"deck1.hotcue5" = ["97 40", "99 40"]
"deck1.hotcue6" = ["97 41", "99 41"]
"deck1.hotcue7" = ["97 42", "99 42"]
"deck1.hotcue8" = ["97 43", "99 43"]
"deck1.hotcue1_delete" = ["97 08", "99 08"]
"deck1.hotcue2_delete" = ["97 09", "99 09"]
"deck1.hotcue3_delete" = ["97 0A", "99 0A"]
"deck1.hotcue4_delete" = ["97 0B", "99 0B"]
"deck1.hotcue5_delete" = ["97 48", "99 48"]
"deck1.hotcue6_delete" = ["97 49", "99 49"]
"deck1.hotcue7_delete" = ["97 4A", "99 4A"]
"deck1.hotcue8_delete" = ["97 4B", "99 4B"]
# AUTO LOOP mode: pads 1-4 loop 1/2/4/8 beats, SHIFT + pads 1-2 loop 16/32.
"deck1.beatloop3" = ["97 10", "99 10"]
"deck1.beatloop4" = ["97 11", "99 11"]
"deck1.beatloop5" = ["97 12", "99 12"]
"deck1.beatloop6" = ["97 13", "99 13"]
"deck1.beatloop7" = ["97 18", "99 18"]
"deck1.beatloop8" = ["97 19", "99 19"]
# MANUAL LOOP mode: IN, OUT, EXIT, 1/2X; SHIFT + pad 4 is 2X.
"deck1.loop_in" = ["97 20", "99 20"]
"deck1.loop_out" = ["97 21", "99 21"]
"deck1.reloop" = ["97 22", "99 22"]
"deck1.loop_half" = ["97 23", "99 23"]
"deck1.loop_double" = ["97 2B", "99 2B"]
"deck1.meter" = ["B0 02", "B2 02"]
"ch1.trim" = ["B0 04 24", "B2 04 24"]
"ch1.hi" = ["B0 07 27", "B2 07 27"]
"ch1.mid" = ["B0 0B 2B", "B2 0B 2B"]
