# Pioneer DDJ-SB3: two mixer channels, four decks. With DECK 3/4 selected a side sends on
# MIDI channel 3/4 (pads on 10/11); those messages drive decks 1/2 here. Pads on channels 8/9;
# SHIFT + pad is the pad note + 8 on the same channel.
name = "Pioneer DDJ-SB3"
ports = ["DDJ-SB3"]
jog_ticks_per_rev = 720
invert_tempo = false
init = ["9B 09 7F"]

[bind]
"deck1.play" = ["90 0B", "92 0B"]
"deck1.cue" = ["90 0C", "92 0C"]
"deck1.sync" = ["90 58", "92 58"]
"deck1.master_tempo" = ["90 1A", "92 1A"]
"deck1.reverse" = ["90 47", "92 47"]
"deck1.to_start" = ["90 48", "92 48"]
"deck1.tempo" = ["B0 00 20", "B2 00 20"]
"deck1.jog_touch" = ["90 36", "90 67", "92 36", "92 67"]
"deck1.jog_scratch" = ["B0 22", "B2 22"]
"deck1.jog_bend" = ["B0 21", "B0 23", "B2 21", "B2 23"]
"deck1.jog_search" = ["B0 1F", "B0 26", "B2 1F", "B2 26"]
# SHIFT + KEY LOCK.
"deck1.tempo_range" = ["90 60", "92 60"]
"deck1.load" = ["96 46", "96 48"]
# AUTO LOOP; SHIFT + AUTO LOOP is RELOOP, SHIFT + 1/2X and 2X are LOOP IN and OUT.
"deck1.loop_4" = ["90 14", "92 14"]
"deck1.reloop" = ["90 50", "92 50"]
"deck1.loop_half" = ["90 12", "92 12"]
"deck1.loop_double" = ["90 13", "92 13"]
"deck1.loop_in" = ["90 61", "92 61"]
"deck1.loop_out" = ["90 62", "92 62"]
"deck1.hotcue1" = ["97 00", "99 00"]
"deck1.hotcue2" = ["97 01", "99 01"]
"deck1.hotcue3" = ["97 02", "99 02"]
"deck1.hotcue4" = ["97 03", "99 03"]
"deck1.hotcue5" = ["97 04", "99 04"]
"deck1.hotcue6" = ["97 05", "99 05"]
"deck1.hotcue7" = ["97 06", "99 06"]
"deck1.hotcue8" = ["97 07", "99 07"]
"deck1.hotcue1_delete" = ["97 08", "99 08"]
"deck1.hotcue2_delete" = ["97 09", "99 09"]
"deck1.hotcue3_delete" = ["97 0A", "99 0A"]
"deck1.hotcue4_delete" = ["97 0B", "99 0B"]
"deck1.hotcue5_delete" = ["97 0C", "99 0C"]
"deck1.hotcue6_delete" = ["97 0D", "99 0D"]
"deck1.hotcue7_delete" = ["97 0E", "99 0E"]
"deck1.hotcue8_delete" = ["97 0F", "99 0F"]
# BEAT JUMP mode (SHIFT + HOT CUE): SHIFT + pads 1-4 jump back 4/8/16/32 beats, SHIFT +
# pads 5-8 forward. Only the 4- and 8-beat jumps have a CDeckJ control.
"deck1.beatjump5" = ["97 48", "99 48"]
"deck1.beatjump6" = ["97 4C", "99 4C"]
"deck1.beatjump7" = ["97 49", "99 49"]
"deck1.beatjump8" = ["97 4D", "99 4D"]
"deck1.meter" = ["B0 02", "B2 02"]
"ch1.trim" = ["B0 04 24", "B2 04 24"]
"ch1.hi" = ["B0 07 27", "B2 07 27"]
"ch1.mid" = ["B0 0B 2B", "B2 0B 2B"]
"ch1.low" = ["B0 0F 2F", "B2 0F 2F"]
"ch1.fader" = ["B0 13 33", "B2 13 33"]
