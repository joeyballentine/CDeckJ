# Denon MC7000. Four decks: 1 and 3 on the left (MIDI channels 1 and 3), 2 and 4 on the right
# (2 and 4); decks 3/4 drive CDeckJ's decks 1/2. Pads and loops on channels 5-8, FX on 9-10,
# browser and globals on 16. Mixer channels 3/4 are left out.
# Most shifted buttons send their own notes. SHIFT is bound too because SHIFT + jog sends the
# same CC as the jog alone.
name = "Denon MC7000"
ports = ["MC7000"]
jog_ticks_per_rev = 894
invert_tempo = false
led_off = 0x01
# Asks the controller to report its knob and fader positions.
init = ["F0 00 20 7F 03 01 F7"]

[bind]
"deck1.shift" = ["90 32", "92 32"]
"deck1.play" = ["90 00", "92 00"]
"deck1.cue" = ["90 01", "92 01"]
"deck1.sync" = ["90 02", "92 02"]
"deck1.tempo_range" = ["90 2B", "92 2B"]
"deck1.master_tempo" = ["90 0D", "92 0D"]
# SHIFT + CUE
"deck1.to_start" = ["90 05", "92 05"]
# CENSOR
"deck1.reverse" = ["90 10", "92 10"]
"deck1.load" = ["9F 02", "9F 04"]
"deck1.tempo" = ["B0 09 77", "B2 09 77"]
"deck1.jog_touch" = ["90 06", "92 06"]
"deck1.jog" = ["B0 06", "B2 06"]
"deck1.jog_search" = ["shift B0 06", "shift B2 06"]
"deck1.loop_4" = ["94 32", "96 32"]
"deck1.reloop" = ["94 33", "96 33"]
"deck1.loop_half" = ["94 34", "96 34"]
"deck1.loop_double" = ["94 35", "96 35"]
"deck1.loop_in" = ["94 38", "96 38"]
"deck1.loop_out" = ["94 39", "96 39"]
"deck1.hotcue1" = ["94 14", "96 14"]
"deck1.hotcue2" = ["94 15", "96 15"]
"deck1.hotcue3" = ["94 16", "96 16"]
"deck1.hotcue4" = ["94 17", "96 17"]
"deck1.hotcue5" = ["94 18", "96 18"]
