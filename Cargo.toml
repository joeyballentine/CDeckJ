[package]
name = "platter"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Minimal CDJ-style DJ player for the Steam Deck and DDJ-GRV6"

[dependencies]
cpal = { version = "0.18.2", features = ["pulseaudio"] }
crossbeam-channel = "0.5.17"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
egui = "0.37"
midir = "0.11.1"
parking_lot = "0.12.5"
symphonia = { version = "0.6.1", features = ["all-codecs", "all-formats"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# Keep DSP fast even in debug builds
[profile.dev.package."*"]
opt-level = 2
[profile.dev]
opt-level = 1
